apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
labels:
  - pairs:
      grafana_dashboard: "1"
    includeSelectors: false
configMapGenerator:
  - name: amazon-dashboard
    files:
      - amazon-overview.json=grafana/amazon-overview.json
    options:
      disableNameSuffixHash: true
  - name: netflix-dashboard
    files:
      - netflix-overview.json=grafana/netflix-overview.json
    options:
      disableNameSuffixHash: true
